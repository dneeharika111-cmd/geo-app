<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GeoPulse Login</title>
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container site-header-inner">
        <a class="brand" href="index.html">
          <span class="brand-mark">GP</span>
          <span>GeoPulse</span>
        </a>
        <nav class="nav-links">
          <a href="index.html">Home</a>
          <a href="features.html">Features</a>
          <a href="products.html">Products</a>
          <a href="use-cases.html">Use Cases</a>
          <a class="cta cta-primary" href="dashboard.html">Get Started</a>
        </nav>
      </div>
    </header>

    <main class="site-shell">
      <div class="container">
        <section class="split-2" style="margin-top:28px;">
          <div class="page-hero">
            <p class="hero-eyebrow">Welcome Back</p>
            <h1>Log in to GeoPulse</h1>
            <p>Access audits, prompt tests, reports, and competitor visibility insights from one premium GEO dashboard.</p>
          </div>
          <div class="card">
            <div class="card-body">
              <div class="field">
                <label>Email</label>
                <input type="email" placeholder="team@brand.com" />
              </div>
              <div class="field" style="margin-top:16px;">
                <label>Password</label>
                <input type="password" placeholder="••••••••" />
              </div>
              <div style="margin-top:22px;">
                <a class="cta cta-primary" href="dashboard.html" style="width:100%;">Login</a>
              </div>
              <div class="notice" style="color:#8a4b11;margin-top:18px;">
                Static HTML mode: this page is a UI-only login screen for public hosting.
              </div>
            </div>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
